# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Feature Request
description: Suggest an enhancement for jspassgen-sdk-cpp
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        This library is a native port of the jspassgen core. A new
        password type or rule starts in the core, in
        https://github.com/sebastienrousseau/jspassgen.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Real-World Use Case
    validations:
      required: true
  - type: dropdown
    id: breaking_change
    attributes:
      label: Breaking Change?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
