#
# Dependabot has no CMake FetchContent ecosystem, so the GoogleTest pin
# in tests/CMakeLists.txt is reviewed by hand. It does track the
# workflow actions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
